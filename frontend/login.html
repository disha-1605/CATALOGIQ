<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FBF7F3]">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CatalogIQ</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            base: '#FBF7F3',
            surface: '#FFFFFF',
            structure: '#101827',
            fashion: '#E83E4F',
            'fashion-warm': '#F97316',
          }
        }
      }
    }
  </script>
  <script src="api.js"></script>
</head>
<body class="h-full bg-[#FBF7F3] text-slate-900 antialiased flex flex-col justify-center items-center p-4 selection:bg-[#FDE7E7] selection:text-[#E83E4F]">

  <!-- Auth Card Container -->
  <div class="w-full max-w-md space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#101827] text-white shadow-md mb-2 border border-slate-800">
        <span class="font-display font-bold text-2xl text-[#E83E4F]">Q</span>
      </div>
      <h1 class="text-3xl font-bold font-display text-slate-900 tracking-tight">CatalogIQ</h1>
      <p class="text-sm text-slate-600 font-sans font-medium">Catalog intelligence for better search</p>
    </div>

    <!-- Login Form Card -->
    <div class="bg-white rounded-2xl p-7 sm:p-8 border border-stone-200/90 shadow-sm space-y-5">
      
      <!-- Inline Error Message Container -->
      <div id="login-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px] text-rose-600">error</span>
        <span id="login-error-text">Invalid email or password.</span>
      </div>

      <form id="login-form" class="space-y-4" onsubmit="handleLoginSubmit(event)">
        
        <!-- Email Input -->
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider font-mono">
            Email
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-[18px] text-slate-400">mail</span>
            <input type="email" 
                   id="email" 
                   name="email" 
                   required
                   placeholder="Enter your work email" 
                   class="w-full pl-10 pr-4 py-2.5 text-sm bg-stone-50 border border-stone-300 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#E83E4F] focus:bg-white focus:ring-1 focus:ring-[#E83E4F]/20 transition-all font-sans"/>
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider font-mono">
            Password
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-[18px] text-slate-400">lock</span>
            <input type="password" 
                   id="password" 
                   name="password" 
                   required
                   placeholder="Enter your password" 
                   class="w-full pl-10 pr-4 py-2.5 text-sm bg-stone-50 border border-stone-300 rounded-xl text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#E83E4F] focus:bg-white focus:ring-1 focus:ring-[#E83E4F]/20 transition-all font-sans"/>
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="submit" 
                id="btn-signin"
                class="w-full py-2.5 px-4 rounded-xl bg-[#101827] hover:bg-slate-800 text-white font-semibold text-sm transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
          <span>Sign In</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
      </form>

      <!-- Request Access Row (Part 2 Requirement) -->
      <div class="pt-4 border-t border-stone-100 text-center text-xs text-slate-500 font-sans">
        <span>New to CatalogIQ?</span>
        <button type="button" 
                onclick="openRequestAccessModal()" 
                class="font-semibold text-slate-900 hover:text-[#E83E4F] transition-colors ml-1 cursor-pointer focus:outline-none underline-offset-2 hover:underline">
          Request access
        </button>
      </div>
    </div>

    <!-- Footer Note -->
    <div class="text-center">
      <p class="text-[11px] font-mono text-slate-500">CatalogIQ Enterprise Intelligence Platform · v1.0</p>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- REQUEST ACCESS MODAL (PART 2 REQUIREMENT) -->
  <!-- ========================================================================= -->
  <div id="request-access-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full border border-stone-200 shadow-2xl overflow-hidden flex flex-col">
      <!-- Modal Header -->
      <div class="p-5 border-b border-stone-100 flex items-center justify-between bg-stone-50/70">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-rose-100 text-[#E83E4F] flex items-center justify-center">
            <span class="material-symbols-outlined text-[18px]">badge</span>
          </div>
          <div>
            <h3 class="font-display font-bold text-base text-slate-900 tracking-tight">Request access to CatalogIQ</h3>
            <p class="text-[11px] text-slate-500">Available to authorized catalog and search teams</p>
          </div>
        </div>
        <button onclick="closeRequestAccessModal()" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-stone-200/60 transition-colors">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 space-y-4">
        
        <!-- Feedback / Notification Area -->
        <div id="req-feedback" class="hidden p-3 rounded-xl text-xs font-medium"></div>

        <form id="access-request-form" class="space-y-3.5" onsubmit="handleRequestAccessSubmit(event)">
          
          <div class="space-y-1">
            <label for="req-name-input" class="block text-xs font-semibold text-slate-700 font-mono uppercase tracking-wider">
              Full Name <span class="text-rose-600">*</span>
            </label>
            <input type="text" 
                   id="req-name-input" 
                   required
                   placeholder="Enter your full name" 
                   class="w-full px-3 py-2 text-xs bg-stone-50 border border-stone-300 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#E83E4F] focus:bg-white focus:ring-1 focus:ring-[#E83E4F]/20 font-sans shadow-2xs transition-all"/>
          </div>

          <div class="space-y-1">
            <label for="req-email-input" class="block text-xs font-semibold text-slate-700 font-mono uppercase tracking-wider">
              Work Email <span class="text-rose-600">*</span>
            </label>
            <input type="email" 
                   id="req-email-input" 
                   required
                   placeholder="Enter your work email" 
                   class="w-full px-3 py-2 text-xs bg-stone-50 border border-stone-300 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#E83E4F] focus:bg-white focus:ring-1 focus:ring-[#E83E4F]/20 font-sans shadow-2xs transition-all"/>
          </div>

          <div class="space-y-1">
            <label for="req-org-input" class="block text-xs font-semibold text-slate-700 font-mono uppercase tracking-wider">
              Organization <span class="text-rose-600">*</span>
            </label>
            <input type="text" 
                   id="req-org-input" 
                   required
                   placeholder="Enter your organization" 
                   class="w-full px-3 py-2 text-xs bg-stone-50 border border-stone-300 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#E83E4F] focus:bg-white focus:ring-1 focus:ring-[#E83E4F]/20 font-sans shadow-2xs transition-all"/>
          </div>

          <div class="space-y-1">
            <label for="req-role-input" class="block text-xs font-semibold text-slate-700 font-mono uppercase tracking-wider">
              Role / Team <span class="text-slate-400 font-normal lowercase">(optional)</span>
            </label>
            <input type="text" 
                   id="req-role-input" 
                   placeholder="e.g. Catalog Operations" 
                   class="w-full px-3 py-2 text-xs bg-stone-50 border border-stone-300 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#E83E4F] focus:bg-white focus:ring-1 focus:ring-[#E83E4F]/20 font-sans shadow-2xs transition-all"/>
          </div>

          <!-- Buttons -->
          <div class="pt-3 border-t border-stone-100 flex items-center justify-end gap-2.5">
            <button type="button" 
                    onclick="closeRequestAccessModal()" 
                    class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-slate-700 rounded-xl text-xs font-semibold transition-all">
              Cancel
            </button>
            <button type="submit" 
                    id="btn-req-submit" 
                    class="inline-flex items-center gap-1.5 px-5 py-2 bg-[#E83E4F] hover:bg-[#D42B3C] text-white rounded-xl text-xs font-semibold shadow-xs transition-all cursor-pointer">
              <span class="material-symbols-outlined text-[16px]">send</span>
              <span>Request access</span>
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script>
    // If already authenticated, redirect straight to dashboard
    if (CatalogIQ_Auth.isAuthenticated()) {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || 'dashboard.html';
      window.location.href = redirect;
    }

    function openRequestAccessModal() {
      const modal = document.getElementById('request-access-modal');
      const feedback = document.getElementById('req-feedback');
      feedback.className = 'hidden p-3 rounded-xl text-xs font-medium';
      feedback.textContent = '';
      document.getElementById('access-request-form').reset();
      document.getElementById('btn-req-submit').disabled = false;
      document.getElementById('btn-req-submit').innerHTML = `
        <span class="material-symbols-outlined text-[16px]">send</span>
        <span>Request access</span>
      `;
      modal.classList.remove('hidden');
    }

    function closeRequestAccessModal() {
      document.getElementById('request-access-modal').classList.add('hidden');
    }

    async function handleRequestAccessSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('req-name-input').value.trim();
      const email = document.getElementById('req-email-input').value.trim();
      const org = document.getElementById('req-org-input').value.trim();
      const role = document.getElementById('req-role-input').value.trim();
      const feedback = document.getElementById('req-feedback');
      const btn = document.getElementById('btn-req-submit');

      if (!name || !email || !org) {
        feedback.className = 'p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 font-medium';
        feedback.textContent = 'Please fill out all required fields.';
        feedback.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span>Submitting...</span>`;

      try {
        const result = await CatalogIQ_Auth.requestAccess({
          name: name,
          email: email,
          organization: org,
          role: role || 'Catalog Operations'
        });

        feedback.className = 'p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 font-medium flex items-center gap-2';
        feedback.innerHTML = `
          <span class="material-symbols-outlined text-emerald-600 text-base">check_circle</span>
          <span>${result.message || 'Access request submitted. An administrator will review your request.'}</span>
        `;
        feedback.classList.remove('hidden');

        btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">done</span><span>Submitted</span>`;

        setTimeout(() => {
          closeRequestAccessModal();
        }, 2200);

      } catch (err) {
        feedback.className = 'p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 font-medium';
        feedback.textContent = err.message || 'Failed to submit access request.';
        feedback.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">send</span><span>Request access</span>`;
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorContainer = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const btn = document.getElementById('btn-signin');

      btn.disabled = true;
      btn.innerHTML = `<span>Signing in...</span>`;

      const result = await CatalogIQ_Auth.login(email, password);

      if (result.success) {
        errorContainer.classList.add('hidden');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'dashboard.html';
        window.location.href = redirect;
      } else {
        errorText.textContent = result.error || 'Invalid email or password.';
        errorContainer.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `
          <span>Sign In</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        `;
      }
    }
  </script>
</body>
</html>
